openapi: 3.1.0
info:
  title: Marquei API
  version: 0.1.0
  description: |
    Contrato inicial da API (BN-1). Fonte unica para o cliente gerado em `packages/api-client`.

    Convencoes:
    - O estabelecimento (tenant) NUNCA trafega em corpo, query, header ou rota autenticada:
      vem do token bearer. A unica rota publica que recebe o `slug` e a resolucao da marca.
    - Datas e horas em ISO 8601 UTC (`2026-10-27T15:00:00.000Z`). O parametro `data` de
      horarios livres e um dia civil no fuso do estabelecimento (`YYYY-MM-DD`).
    - Dinheiro em centavos inteiros.
    - Todo erro devolve `{ codigo, mensagem }`; o `codigo` e estavel e e o que o cliente deve usar.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
tags:
  - name: estabelecimento
  - name: catalogo
  - name: agenda
  - name: tema
paths:
  /v1/estabelecimentos/{slug}:
    get:
      tags: [estabelecimento]
      operationId: obterEstabelecimentoPorSlug
      summary: Dados publicos do estabelecimento e tema publicado
      description: Rota publica (com rate limit). Nunca devolve tema em rascunho.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{1,61})[a-z0-9]$"
      responses:
        "200":
          description: Estabelecimento encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstabelecimentoPublico"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "429":
          $ref: "#/components/responses/MuitasRequisicoes"
  /v1/servicos:
    get:
      tags: [catalogo]
      operationId: listarServicos
      summary: Lista os servicos ativos do estabelecimento da sessao
      responses:
        "200":
          description: Servicos ativos.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                additionalProperties: false
                properties:
                  itens:
                    type: array
                    items:
                      $ref: "#/components/schemas/Servico"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
  /v1/horarios-livres:
    get:
      tags: [agenda]
      operationId: listarHorariosLivres
      summary: Horarios livres para um servico em um dia
      description: |
        Respeita duracao do servico, intervalo entre atendimentos, folgas, bloqueios e
        agendamentos existentes. Sem `profissionalId`, agrega todos os profissionais
        que executam o servico.
      parameters:
        - name: servicoId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: profissionalId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: data
          in: query
          required: true
          description: Dia civil no fuso do estabelecimento.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Horarios livres do dia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorariosLivres"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /v1/agendamentos:
    post:
      tags: [agenda]
      operationId: criarAgendamento
      summary: Cria um agendamento para o cliente autenticado
      description: O cliente final e o estabelecimento vem do token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovoAgendamento"
      responses:
        "201":
          description: Agendamento confirmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agendamento"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Horario ja ocupado (`horario_indisponivel`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
          description: "Regra de negocio violada (ex.: `agendamento_no_passado`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "429":
          $ref: "#/components/responses/MuitasRequisicoes"
  /v1/agendamentos/{id}/cancelar:
    post:
      tags: [agenda]
      operationId: cancelarAgendamento
      summary: Cancela um agendamento dentro da politica de cancelamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agendamento cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agendamento"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "422":
          description: >-
            Nao cancelavel (`agendamento_nao_cancelavel`) ou fora do prazo
            (`fora_do_prazo_de_cancelamento`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /v1/tema:
    get:
      tags: [tema]
      operationId: obterTemaPublicado
      summary: Tema publicado do estabelecimento da sessao
      description: |
        Qualquer sessao do estabelecimento (inclusive cliente final) le o tema publicado. Nunca
        devolve rascunho. Enquanto nada foi publicado, devolve o padrao da vertical
        (`origem: padrao`, `versao: 0`).
      responses:
        "200":
          description: Tema publicado ou padrao da vertical.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaDeTema"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
  /v1/tema/opcoes:
    get:
      tags: [tema]
      operationId: listarOpcoesDeTema
      summary: Opcoes curadas disponiveis para montar um tema
      description: Familias tipograficas, raios, densidades, presets, campos de cor e contraste minimo.
      responses:
        "200":
          description: Opcoes curadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpcoesDeTema"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
  /v1/tema/rascunho:
    get:
      tags: [tema]
      operationId: obterRascunhoDoTema
      summary: Ponto de partida do editor (dono ou gestor)
      description: |
        Devolve o rascunho salvo (`origem: rascunho`); sem rascunho, o publicado
        (`origem: publicado`); sem ambos, o padrao da vertical (`origem: padrao`, `versao: 0`).
      responses:
        "200":
          description: Tema para edicao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaDeTema"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissaoParaTema"
    put:
      tags: [tema]
      operationId: salvarRascunhoDoTema
      summary: Salva o rascunho do tema (dono ou gestor)
      description: |
        Aceita contraste abaixo de AA: so a publicacao exige. Nao altera o tema publicado.
        Emite `tema_rascunho_salvo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemaTokens"
      responses:
        "200":
          description: Rascunho salvo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaDeTema"
        "400":
          description: "Tema fora do esquema ou das opcoes curadas (`tema_invalido`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroDeTema"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissaoParaTema"
  /v1/tema/rascunho/restaurar-padrao:
    post:
      tags: [tema]
      operationId: restaurarTemaPadraoDaVertical
      summary: Substitui o rascunho pelo tema padrao da vertical (dono ou gestor)
      description: Nao altera o tema publicado. Emite `tema_rascunho_salvo`.
      responses:
        "200":
          description: Rascunho restaurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaDeTema"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissaoParaTema"
  /v1/tema/publicar:
    post:
      tags: [tema]
      operationId: publicarTema
      summary: Publica o rascunho (dono ou gestor)
      description: |
        Exige contraste WCAG AA. Se reprovar, responde 422 com a cor sugerida por campo e o tema
        publicado permanece como estava. Emite `tema_publicado`.
      responses:
        "200":
          description: Tema publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaDeTema"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissaoParaTema"
        "404":
          description: Nao ha rascunho salvo (`rascunho_de_tema_nao_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroDeTema"
        "422":
          description: Contraste abaixo de AA (`contraste_insuficiente`), com sugestoes em `detalhes`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroDeTema"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    SemPermissaoParaTema:
      description: >-
        Somente dono ou gestor alteram ou leem o rascunho (`sem_permissao_para_alterar_tema`);
        tenant divergente do token tambem responde 403 (`tenant_divergente`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroDeTema"
    RequisicaoInvalida:
      description: "Entrada invalida (`requisicao_invalida`, `identificador_invalido`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    NaoAutenticado:
      description: Token ausente, expirado ou invalido (`nao_autenticado`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    NaoEncontrado:
      description: >-
        Recurso inexistente ou de outro estabelecimento; ambos respondem igual
        (`nao_encontrado`, `agendamento_nao_encontrado`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    MuitasRequisicoes:
      description: Rate limit excedido (`muitas_requisicoes`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
  schemas:
    CorHex:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      examples: ["#2457c5"]
    TermoDoVocabulario:
      type: object
      required: [singular, plural]
      additionalProperties: false
      properties:
        singular:
          type: string
          minLength: 1
          maxLength: 30
        plural:
          type: string
          minLength: 1
          maxLength: 30
    TemaTokens:
      type: object
      description: Tokens do tema (esquema de `packages/design-tokens`). So opcoes curadas.
      required: [cores, familia, raio, densidade, cabecalho, cartaoDeServico, textos, vocabulario]
      additionalProperties: false
      properties:
        cores:
          type: object
          required: [primaria, textoSobrePrimaria, apoio, fundo, superficie, texto, textoSuave]
          additionalProperties: false
          properties:
            primaria:
              $ref: "#/components/schemas/CorHex"
            textoSobrePrimaria:
              $ref: "#/components/schemas/CorHex"
            apoio:
              $ref: "#/components/schemas/CorHex"
            fundo:
              $ref: "#/components/schemas/CorHex"
            superficie:
              $ref: "#/components/schemas/CorHex"
            texto:
              $ref: "#/components/schemas/CorHex"
            textoSuave:
              $ref: "#/components/schemas/CorHex"
        familia:
          type: string
          enum: [inter, poppins, montserrat, playfair-display, roboto-slab]
        raio:
          type: string
          enum: [reto, suave, arredondado]
        densidade:
          type: string
          enum: [compacta, confortavel]
        cabecalho:
          type: string
          enum: [simples, centralizado, capa]
        cartaoDeServico:
          type: string
          enum: [lista, destaque, grade]
        textos:
          type: object
          required: [boasVindas, confirmacao]
          additionalProperties: false
          properties:
            boasVindas:
              type: string
              minLength: 1
              maxLength: 120
            confirmacao:
              type: string
              minLength: 1
              maxLength: 240
        vocabulario:
          type: object
          required: [profissional, servico, agendamento]
          additionalProperties: false
          properties:
            profissional:
              $ref: "#/components/schemas/TermoDoVocabulario"
            servico:
              $ref: "#/components/schemas/TermoDoVocabulario"
            agendamento:
              $ref: "#/components/schemas/TermoDoVocabulario"
    RespostaDeTema:
      type: object
      required: [versao, atualizadoEm, origem, tokens]
      additionalProperties: false
      properties:
        versao:
          type: integer
          minimum: 0
          description: Versao do estado devolvido. 0 = padrao da vertical, nunca salvo.
        atualizadoEm:
          oneOf:
            - $ref: "#/components/schemas/Instante"
            - type: "null"
        origem:
          type: string
          enum: [rascunho, publicado, padrao]
        tokens:
          $ref: "#/components/schemas/TemaTokens"
    OpcoesDeTema:
      type: object
      required:
        [
          familias,
          raios,
          densidades,
          cabecalhos,
          cartoesDeServico,
          camposDeCor,
          verticais,
          contrasteMinimo,
        ]
      additionalProperties: false
      properties:
        familias:
          type: array
          items:
            type: object
            required: [id, nome, pilhaCss]
            additionalProperties: false
            properties:
              id:
                type: string
              nome:
                type: string
              pilhaCss:
                type: string
        raios:
          type: array
          items:
            type: object
            required: [id, escala]
            additionalProperties: false
            properties:
              id:
                type: string
              escala:
                type: object
                required: [campo, botao, cartao]
                additionalProperties: false
                properties:
                  campo:
                    type: integer
                  botao:
                    type: integer
                  cartao:
                    type: integer
        densidades:
          type: array
          items:
            type: object
            required: [id, espacamento]
            additionalProperties: false
            properties:
              id:
                type: string
              espacamento:
                type: object
                required: [xs, sm, md, lg, xl, alturaDoCampo]
                additionalProperties: false
                properties:
                  xs:
                    type: integer
                  sm:
                    type: integer
                  md:
                    type: integer
                  lg:
                    type: integer
                  xl:
                    type: integer
                  alturaDoCampo:
                    type: integer
        cabecalhos:
          type: array
          items:
            type: string
        cartoesDeServico:
          type: array
          items:
            type: string
        camposDeCor:
          type: array
          items:
            type: string
        verticais:
          type: array
          items:
            type: string
        contrasteMinimo:
          type: object
          required: [textoNormal, componente]
          additionalProperties: false
          properties:
            textoNormal:
              type: number
              examples: [4.5]
            componente:
              type: number
              examples: [3]
    ErroDeTema:
      type: object
      required: [codigo, mensagem]
      additionalProperties: false
      properties:
        codigo:
          type: string
          examples: [contraste_insuficiente, tema_invalido, sem_permissao_para_alterar_tema]
        mensagem:
          type: string
        detalhes:
          type: array
          description: >-
            Por campo. Em `contraste_insuficiente`, `sugestao` traz a cor que passa em AA para o
            `campo` ajustavel; em `tema_invalido`, `campo` e o caminho pontuado do problema.
          items:
            type: object
            required: [campo, codigo]
            additionalProperties: false
            properties:
              campo:
                type: string
              codigo:
                type: string
              mensagem:
                type: string
              sugestao:
                $ref: "#/components/schemas/CorHex"
    Erro:
      type: object
      required: [codigo, mensagem]
      additionalProperties: false
      properties:
        codigo:
          type: string
          description: Codigo estavel em snake_case. Use-o, nunca a mensagem, para decidir o comportamento.
          examples: [horario_indisponivel, fora_do_prazo_de_cancelamento]
        mensagem:
          type: string
          description: Texto para depuracao; nao e contrato.
        detalhes:
          type: array
          description: Problemas por campo, quando a entrada e invalida.
          items:
            type: object
            required: [campo, codigo]
            additionalProperties: false
            properties:
              campo:
                type: string
              codigo:
                type: string
    Instante:
      type: string
      format: date-time
      description: ISO 8601 em UTC.
      examples: ["2026-10-27T15:00:00.000Z"]
    Centavos:
      type: integer
      minimum: 0
      description: Valor em centavos de real.
    EstabelecimentoPublico:
      type: object
      required: [id, slug, nome, vertical, fusoHorario, tema]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        nome:
          type: string
        vertical:
          type: string
        fusoHorario:
          type: string
          description: Fuso IANA.
          examples: [America/Sao_Paulo]
        tema:
          $ref: "#/components/schemas/TemaPublicado"
    TemaPublicado:
      type: object
      description: >-
        Envelope provisorio do tema publicado. O esquema detalhado dos tokens pertence a
        `packages/design-tokens` (DS) e sera referenciado aqui quando acordado.
      required: [versao, tokens]
      additionalProperties: false
      properties:
        versao:
          type: integer
          minimum: 1
        tokens:
          type: object
          additionalProperties: true
    Servico:
      type: object
      required: [id, nome, duracaoMinutos, precoCentavos]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        duracaoMinutos:
          type: integer
          minimum: 1
        precoCentavos:
          $ref: "#/components/schemas/Centavos"
    HorariosLivres:
      type: object
      required: [data, fusoHorario, itens]
      additionalProperties: false
      properties:
        data:
          type: string
          format: date
        fusoHorario:
          type: string
        itens:
          type: array
          items:
            $ref: "#/components/schemas/HorarioLivre"
    HorarioLivre:
      type: object
      required: [profissionalId, inicio, fim]
      additionalProperties: false
      properties:
        profissionalId:
          type: string
          format: uuid
        inicio:
          $ref: "#/components/schemas/Instante"
        fim:
          $ref: "#/components/schemas/Instante"
    NovoAgendamento:
      type: object
      required: [servicoId, profissionalId, inicio]
      additionalProperties: false
      properties:
        servicoId:
          type: string
          format: uuid
        profissionalId:
          type: string
          format: uuid
        inicio:
          $ref: "#/components/schemas/Instante"
    StatusAgendamento:
      type: string
      enum: [confirmado, cancelado, concluido]
    Agendamento:
      type: object
      required: [id, servicoId, profissionalId, inicio, fim, status, precoCentavos]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        servicoId:
          type: string
          format: uuid
        profissionalId:
          type: string
          format: uuid
        inicio:
          $ref: "#/components/schemas/Instante"
        fim:
          $ref: "#/components/schemas/Instante"
        status:
          $ref: "#/components/schemas/StatusAgendamento"
        precoCentavos:
          $ref: "#/components/schemas/Centavos"
security:
  - bearerAuth: []
